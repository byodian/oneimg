name = "oneimgai"
main = ".open-next/worker.js"
compatibility_date = "2025-03-01"
compatibility_flags = [
    "nodejs_compat",
    "nodejs_compat_populate_process_env",
    "global_fetch_strictly_public"
]

[assets] 
binding = "ASSETS"
directory = ".open-next/assets"

[observability]
enabled = true
